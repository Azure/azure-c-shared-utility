- job: clang
  timeoutInMinutes: 90
  pool:
    vmImage: 'ubuntu-24.04'
  displayName: 'Linux Ubuntu Clang'
  steps:
  - checkout: self
    submodules: recursive
  - script: |
      set -e
      sudo apt-get update
      sudo apt-get install -y clang cmake build-essential pkg-config curl libcurl4-openssl-dev libssl-dev uuid-dev valgrind
    displayName: 'Host setup'
  - script: |
      export OPENSSL_ia32cap=0x00000000
      # The retired container selected clang through its environment; nothing does on a hosted agent.
      export CC=clang
      export CXX=clang++
      sudo chmod -R 755 .
      sudo -E ./jenkins/ubuntu_clang.sh
    displayName: 'Build'
  - script: |
      cd cmake && sudo -E ../build_all/linux/run_tests.sh
    displayName: 'Run Tests'
  - task: PublishTestResults@2
    displayName: 'Publish Clang Results'
    inputs:
      testRunner: CTest
      testResultsFiles: '**/Test.xml'
      mergeTestResults: true
      testRunTitle: 'clang'
    condition: succeededOrFailed()

