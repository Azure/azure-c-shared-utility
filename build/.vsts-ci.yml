      done
    displayName: 'Repair Component Detection node runtime'
    condition: always()
  - checkout: self
    submodules: recursive
  - script: |
      curl --version
      export DYLD_LIBRARY_PATH="/usr/local/Cellar/curl/$(ls -b /usr/local/Cellar/curl 2>/dev/null | grep -e '[0-9\.]' | head -1)/lib"
      ./jenkins/osx_xcode_native.sh
    displayName: 'Build'
  - script: |
      export DYLD_LIBRARY_PATH="/usr/local/Cellar/curl/$(ls -b /usr/local/Cellar/curl 2>/dev/null | grep -e '[0-9\.]' | head -1)/lib"
      cd cmake && ctest -T test --no-compress-output -C "Debug" -V -j 8 --schedule-random
    displayName: 'Run Tests'
  - task: PublishTestResults@2
    displayName: 'Publish XCode Results'
    inputs:
      testRunner: CTest
      testResultsFiles: '**/Test.xml'
      mergeTestResults: true
      testRunTitle: 'XCode'
    condition: succeededOrFailed()
  # Recreate s/: the Component Detection task injected after this step runs from it.
  - script: |
      rm -rf $(Agent.BuildDirectory)/*
      mkdir -p $(Agent.BuildDirectory)/s
    displayName: 'Cleanup'
    condition: always()

- job: raspberrypi
  # Replaces the retired raspberrypi-c-buster container: cross-compiles for armhf
  # on an x64 hosted agent. Tests are not executed.
  timeoutInMinutes: 60
  pool:
    vmImage: 'ubuntu-24.04'
  displayName: 'Raspberry Pi (Cross-compile only)'
  steps:
  - checkout: self
    submodules: recursive
  - script: |
      set -e
      sudo apt-get update
      sudo apt-get install -y cmake build-essential pkg-config crossbuild-essential-armhf
    displayName: 'Install armhf cross toolchain'
  - script: |
      set -e
      mkdir -p cmake-armhf
      cd cmake-armhf
      cmake \
        -DCMAKE_SYSTEM_NAME=Linux \
        -DCMAKE_SYSTEM_PROCESSOR=arm \
        -DCMAKE_C_COMPILER=arm-linux-gnueabihf-gcc \
        -DCMAKE_CXX_COMPILER=arm-linux-gnueabihf-g++ \
        -DCMAKE_BUILD_TYPE=Debug \
        -Drun_unittests:BOOL=OFF \
        -Dskip_samples:BOOL=ON \
        -Duse_default_uuid:BOOL=ON \
        -Duse_http:BOOL=OFF \
        -Duse_openssl:BOOL=OFF \
        ..
      make -j$(nproc)
    displayName: 'Cross-compile c-utility for armhf'

