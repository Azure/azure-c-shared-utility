- job: debian
  timeoutInMinutes: 60
  pool:
    vmImage: 'ubuntu-24.04'
  # Builds in a public Debian container so the job still tests Debian rather than
  # the Ubuntu host. Buster is end-of-life with archived repositories, so this
  # tracks current Debian stable. Run via docker because container jobs execute
  # as the agent user, which cannot apt-get install.
  displayName: 'Linux Debian (Bookworm)'
  steps:
  - checkout: self
    submodules: recursive
  - script: |
      set -e
      docker run --rm \
        -v "$(Build.SourcesDirectory)":/src -w /src \
        debian:bookworm bash -c '
          set -e
          apt-get update
          apt-get install -y sudo git ca-certificates cmake build-essential pkg-config curl libcurl4-openssl-dev libssl-dev uuid-dev valgrind
          chmod 755 jenkins/debian_c.sh
          ./jenkins/debian_c.sh
          cd cmake && ../build_all/linux/run_tests.sh
        '
    displayName: 'Build and test in Debian container'
  # docker runs as root; hand the workspace back before the agent cleans it up.
  - script: sudo chown -R `id -u`:`id -g` "$(Build.SourcesDirectory)"
    displayName: 'Restore workspace ownership'
    condition: always()

- job: linux_mbed
  # Ubuntu 24.04's libmbedtls-dev is mbedTLS 2.28 on some images and 3.x on
  # others; install mbedTLS 2.28 from source so the job is deterministic.
  timeoutInMinutes: 60
  pool:
    vmImage: 'ubuntu-24.04'
  displayName: 'mbedTLS'
  steps:
  - checkout: self
    submodules: recursive
  - script: |
      set -e
      sudo apt-get update
      sudo apt-get purge -y 'libmbedtls*' 'libmbedcrypto*' 'libmbedx509*' || true
      sudo apt-get install -y clang cmake build-essential pkg-config curl libcurl4-openssl-dev uuid-dev valgrind
    displayName: 'Host setup'
  - script: |
      set -e
      git clone --depth 1 -b mbedtls-2.28.10 https://github.com/Mbed-TLS/mbedtls /tmp/mbedtls-2.28
      cd /tmp/mbedtls-2.28
      mkdir build && cd build
      cmake -DUSE_SHARED_MBEDTLS_LIBRARY=ON -DENABLE_TESTING=Off -DENABLE_PROGRAMS=Off -DCMAKE_INSTALL_PREFIX=/usr/local ..
      make -j$(nproc)
      sudo make install
      sudo ldconfig
    displayName: 'Install mbedTLS 2.28'
  - script: |
      chmod +x jenkins/linux_mbed_clang_buildonly.sh
      ./jenkins/linux_mbed_clang_buildonly.sh
    displayName: 'Clang Build'
    env:
      LD_LIBRARY_PATH: /usr/local/lib
  - script: |
      sudo chmod 755 jenkins/linux_mbed.sh
      sudo -E ./jenkins/linux_mbed.sh
    displayName: 'Build'
    env:
      LD_LIBRARY_PATH: /usr/local/lib

